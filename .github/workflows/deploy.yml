name: SynapsPay CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend Build & Lint ──────────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check + build
        run: cd frontend && npm run build

      - name: Lint
        run: cd frontend && npm run lint

  # ─── Rust / Soroban Contract Tests ─────────────────────────────────────────
  test-contracts:
    name: 🦀 Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test agent-wallet contract
        working-directory: contracts/agent-wallet
        run: cargo test
        continue-on-error: true

      - name: Test budget-control contract
        working-directory: contracts/budget-control
        run: cargo test
        continue-on-error: true

      - name: Test service-registry contract
        working-directory: contracts/service-registry
        run: cargo test
        continue-on-error: true

      - name: Test escrow contract
        working-directory: contracts/escrow
        run: cargo test
        continue-on-error: true

      - name: Test reputation contract
        working-directory: contracts/reputation
        run: cargo test
        continue-on-error: true

      - name: Test revenue-share contract
        working-directory: contracts/revenue-share
        run: cargo test
        continue-on-error: true

  # ─── Deploy to Vercel (main branch only) ───────────────────────────────────
  deploy:
    name: 🚀 Deploy to Vercel
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        if: vars.VERCEL_TOKEN != ''
        run: |
          cd frontend
          vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Production
        if: vars.VERCEL_TOKEN != ''
        run: |
          cd frontend
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        if: vars.VERCEL_TOKEN != ''
        run: |
          URL=$(cd frontend && vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Skip deploy (no Vercel token configured)
        if: vars.VERCEL_TOKEN == ''
        run: |
          echo "⚠️  Skipping Vercel deploy — VERCEL_TOKEN secret not set."
          echo "    To enable: Settings → Secrets → New secret → VERCEL_TOKEN"
