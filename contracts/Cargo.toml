[workspace]
members = [
    "agent-wallet",
    "service-registry",
    "escrow",
    "reputation",
    "budget-control",
    "revenue-share"
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
